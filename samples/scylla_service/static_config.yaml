components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 4
        fs-task-processor:
            worker_threads: 1

    components:
        server:
            listener:
                port: 8080

        dns-client:
            fs-task-processor: fs-task-processor

        handler-insert:
            path: /v1/insert
            method: POST
            task_processor: main-task-processor

        handler-select:
            path: /v1/select
            method: GET
            task_processor: main-task-processor

        logging:
            loggers:
                default:
                    file_path: '@stderr'
                    level: debug
                    overflow_behavior: discard

        # Option 1: direct connection string (no secdist needed)
        scylla-dbconnection:
            dbconnection: 127.0.0.1
            consistency: local_quorum
            serial_consistency: local_serial
            request_timeout: 10s
            pool_size: 16
            app_name: scylla_sample
            shard_awareness: true
            retry_policy: default
            speculative_execution:
                enabled: false
                max_attempts: 2
                delay: 100ms
            default_keyspace: examples

        # Option 2: hosts resolved via secdist
        scylla-secdist:
            dbalias: scylla_example
            consistency: local_quorum
            serial_consistency: local_serial
            request_timeout: 10s
            pool_size: 16
            app_name: scylla_sample
            shard_awareness: true
            retry_policy: default
            speculative_execution:
                enabled: false
                max_attempts: 2
                delay: 100ms
            default_keyspace: examples

        secdist:
            provider: default-secdist-provider
        default-secdist-provider:
            config: /etc/scylla_service/secdist.json
