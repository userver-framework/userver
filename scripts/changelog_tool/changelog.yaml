collect:
  from_sha: da8642900398c33333e29e2bd3e91ca4e181f602
  to_sha: HEAD
  repo_path: ../..
  core_team_patterns:
    - ".*@userver\\.tech"
    - ".*@yandex-team\\.com"

llm-config:
  target_rps: 1
  retries: 3
  max_commits_per_batch: 4
  max_user_prompt_length: 100000
  include_diff: true
  truncate_diff: false

review:
  github_url: "https://github.com/userver-framework/userver"

report:
  github_url: "https://github.com/userver-framework/userver"
