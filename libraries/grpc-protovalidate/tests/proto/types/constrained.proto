syntax = "proto3";

package types;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

enum TestEnum {
    TEST_ENUM_UNSPECIFIED = 0;
    TEST_ENUM_VALUE_1 = 1;
    TEST_ENUM_VALUE_2 = 2;
}

message ConstrainedMessage {
    option (buf.validate.message).cel = {
        id: "constrained_message.general",
        message: "sum is greater than 10",
        expression: "this.required_rule + this.in_rule <= 10",
    };

    int32 required_rule = 1 [(buf.validate.field).required = true];
    optional bool const_rule = 2 [(buf.validate.field).bool.const = true];
    optional google.protobuf.Duration lt_rule = 3 [(buf.validate.field).duration.lt = { seconds: 5 }];
    optional double gt_rule = 4 [(buf.validate.field).double.gt = 5.5];
    optional int32 in_rule = 5 [(buf.validate.field).int32 = { in: [1, 2, 3] }];
    optional string not_in_rule = 6 [(buf.validate.field).string = { not_in: ["aaa", "bbb"] }];
    optional string uuid_rule = 7 [(buf.validate.field).string.uuid = true];
    optional string regex_rule = 8 [(buf.validate.field).string.pattern = "Hello, *"];
    optional TestEnum defined_only_rule = 9 [(buf.validate.field).enum.defined_only = true];
    repeated int32 unique_gt_rule = 10 [
        (buf.validate.field).repeated.unique = true,
        (buf.validate.field).repeated.items = {
            int32: {
                gt: 10
            }
        }
    ];
    map<string, int32> keys_values_rule = 11 [
        (buf.validate.field).map.keys = {
            string: {
                min_len: 1
                max_len: 3
            }
        },
        (buf.validate.field).map.values = {
            int32: {
                lte: 0
            }
        }
    ];
}

message ConstrainedRequest {
    option (buf.validate.message).cel = {
        id: "constrained_request.general",
        message: "field is greater than 10",
        expression: "this.field <= 10",
    };

    optional int32 field = 1 [(buf.validate.field).int32.gte = -3];
    repeated ConstrainedMessage messages = 2;
}

message ConstrainedResponse {
    option (buf.validate.message).cel = {
        id: "constrained_response.general",
        message: "field is greater than 10",
        expression: "this.field <= 10",
    };

    optional int32 field = 1 [(buf.validate.field).int32.gte = -3];
    repeated ConstrainedMessage messages = 2;
}

message InvalidConstraints {
    option (buf.validate.message).cel = {
        id: "invalid_constraints",
        expression: "this.non_existent_field <= 10",
    };

    int32 field = 1;
}

// Same shape as ConstrainedMessage, without validation rules (benchmark baseline).
message UnconstrainedMessage {
    int32 required_rule = 1;
    optional bool const_rule = 2;
    optional google.protobuf.Duration lt_rule = 3;
    optional double gt_rule = 4;
    optional int32 in_rule = 5;
    optional string not_in_rule = 6;
    optional string uuid_rule = 7;
    optional string regex_rule = 8;
    optional TestEnum defined_only_rule = 9;
    repeated int32 unique_gt_rule = 10;
    map<string, int32> keys_values_rule = 11;
}

message UnconstrainedRequest {
    optional int32 field = 1;
    repeated UnconstrainedMessage messages = 2;
}

message ValidationLeaf {
    int32 value = 1 [(buf.validate.field).int32.gt = 0];
    string payload = 2;
}

message TypeRuleLeaf {
    option (buf.validate.message).cel = {
        id: "type_rule_leaf.positive",
        expression: "this.value > 0",
    };
    int32 value = 1;
}

// Exactly one annotated field in one nested object; the remaining populated subtrees have no rules.
message SparseRequest {
    message Branch {
        ValidationLeaf checked = 1;
        repeated UnconstrainedMessage noise = 2;
    }
    Branch branch = 1;
    repeated UnconstrainedMessage siblings = 2;
    map<string, UnconstrainedMessage> lookup = 3;
    string payload = 4;
}

message TraversalRoot {
    // Deliberately declared out of field-number order to check fail_fast traversal order.
    ValidationLeaf singular = 8;
    repeated ValidationLeaf repeated = 2;
    map<string, ValidationLeaf> string_map = 3;
    map<int64, ValidationLeaf> integer_map = 4;
    map<bool, ValidationLeaf> bool_map = 5;
    TypeRuleLeaf type_rule = 6;
    TraversalRoot recursive = 7;
    UnconstrainedRequest noise = 9;
    ValidationLeaf ignored = 10 [(buf.validate.field).ignore = IGNORE_ALWAYS];
    repeated ValidationLeaf ignored_items = 11 [
        (buf.validate.field).repeated.min_items = 2,
        (buf.validate.field).repeated.items.ignore = IGNORE_ALWAYS
    ];
    map<string, ValidationLeaf> ignored_values = 12 [
        (buf.validate.field).map.min_pairs = 2,
        (buf.validate.field).map.values.ignore = IGNORE_ALWAYS
    ];
    repeated ValidationLeaf ignored_repeated = 13 [(buf.validate.field).ignore = IGNORE_ALWAYS];
    map<string, ValidationLeaf> ignored_map = 14 [(buf.validate.field).ignore = IGNORE_ALWAYS];
}

message AbsentRules {
    ValidationLeaf required = 1 [(buf.validate.field).required = true];
    int32 scalar = 2 [(buf.validate.field).int32.gt = 0];
    repeated int32 items = 3 [(buf.validate.field).repeated.min_items = 1];
    map<string, int32> entries = 4 [(buf.validate.field).map.min_pairs = 1];
    oneof choice {
        option (buf.validate.oneof).required = true;
        string first = 5;
        int32 second = 6;
    }
}

message DisabledRules {
    option (buf.validate.message).disabled = true;
    string ignored = 1 [(buf.validate.field).string.min_len = 1];
    ValidationLeaf nested = 2;
}

message RulelessCycle {
    RulelessCycle next = 1;
    UnconstrainedMessage noise = 2;
}

message ValidationCycleA {
    ValidationCycleB child = 1;
}

message ValidationCycleB {
    ValidationCycleA back = 1;
    ValidationLeaf checked = 2;
}

message InvalidRuleLeaf {
    int32 value = 1 [(buf.validate.field).cel = { id: "invalid", expression: "(" }];
}

message InvalidRuleParent {
    InvalidRuleLeaf child = 1;
    InvalidRuleLeaf ignored = 2 [(buf.validate.field).ignore = IGNORE_ALWAYS];
}

message CrossFieldRules {
    option (buf.validate.message).cel = {
        id: "cross_field_rules.equal",
        expression: "this.limit == this.noise.required_rule",
    };
    int32 limit = 1;
    UnconstrainedMessage noise = 2;
}
