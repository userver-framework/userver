openapi: 3.0.3
info:
  title: Key-Value Storage API
  description: An API to manage a key-value store with CRUD operations and basic authentication.
  version: 1.0.0
servers:
  - url: https://api.kvstore.example.com/v1
    description: Production server
  - url: http://localhost:3000/v1
    description: Development server
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    KeyValuePair:
      type: object
      properties:
        key:
          type: string
          description: Unique key for the item
        value:
          type: string
          description: Value associated with the key
      required:
        - key
        - value
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
paths:
  /kv:
    get:
      summary: Get all key-value pairs
      description: Retrieve all key-value pairs in the store.
      security:
        - BasicAuth: []
      responses:
        '200':
          description: A list of key-value pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyValuePair'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new key-value pair
      description: Add a new key-value pair to the store.
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyValuePair'
      responses:
        '201':
          description: Key-value pair created successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /kv/{key}:
    get:
      summary: Get a key-value pair
      description: Retrieve a value by its key.
      security:
        - BasicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key to retrieve
      responses:
        '200':
          description: Key-value pair retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyValuePair'
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a key-value pair
      description: Update the value associated with a specific key.
      security:
        - BasicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyValuePair'
      responses:
        '200':
          description: Key-value pair updated successfully
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a key-value pair
      description: Remove a key-value pair from the store.
      security:
        - BasicAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: The key to delete
      responses:
        '204':
          description: Key-value pair deleted successfully
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
security:
  - BasicAuth: []