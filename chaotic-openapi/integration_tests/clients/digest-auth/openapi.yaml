openapi: 3.0.0
info:
    title: digest-auth client
    version: '1.0'

components:
    securitySchemes:
        myDigestScheme:
            type: http
            scheme: digest
        myBearerScheme:
            type: http
            scheme: bearer
        myApiKeyScheme:
            type: apiKey
            name: X-Api-Key
            in: header

paths:
    /api/resource:
        get:
            operationId: GetResource
            security:
              - myDigestScheme: []
            responses:
                '200':
                    description: OK
    /api/bearer-resource:
        get:
            operationId: GetBearerResource
            security:
              - myBearerScheme: []
            responses:
                '200':
                    description: OK
    /api/api-key-resource:
        get:
            operationId: GetApiKeyResource
            security:
              - myApiKeyScheme: []
            responses:
                '200':
                    description: OK
