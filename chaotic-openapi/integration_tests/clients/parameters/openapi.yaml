openapi: 3.0.0
info:
    title: test-object client
    version: '1.0'

paths:
    /test1:
        post:
            parameters:
              - name: enum
                in: query
                schema:
                    type: string
                    enum:
                      - one
                      - two
                      - three
              - name: class
                x-usrv-cpp-name: myclass
                in: query
                required: false
                schema:
                    type: string
              - name: multiple
                explode: true
                in: query
                required: false
                schema:
                    type: array
                    items:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                foo:
                                    type: string
                            additionalProperties: false
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    bar:
                                        type: string
                                additionalProperties: false
                '201':
                    description: OK
                '400':
                    description: Some error
                '500':
                    description: Some error

    /test1/query-log-mode:
        get:
            x-taxi-query-log-mode: hide
            parameters:
              - in: query
                name: password
                required: true
                description: >-
                    Warning: should be used for legacy API / test only,
                    as the query might still be logged on proxies/other HTTP agents.
                schema:
                    type: string
              - in: query
                name: secret
                required: false
                description: >-
                    Warning: should be used for legacy API / test only,
                    as the query might still be logged on proxies/other HTTP agents.
                schema:
                    type: string
            responses:
                '200':
                    description: OK

    /test1/query-log-mode/parameter:
        get:
            parameters:
              - in: query
                name: password
                required: true
                description: >-
                    Warning: should be used for legacy API / test only,
                    as the query might still be logged on proxies/other HTTP agents.
                x-taxi-query-log-mode: hide
                schema:
                    type: string
              - in: query
                name: secret
                required: false
                schema:
                    type: string
            responses:
                '200':
                    description: OK

    /test1/typed/{id}:
        get:
            parameters:
              - name: id
                in: path
                required: true
                schema:
                    type: string
                    format: uuid
              - name: account
                in: query
                required: true
                schema:
                    type: string
                    x-usrv-cpp-type: boost::uuids::uuid
              - name: station
                in: query
                required: false
                schema:
                    $ref: '#/components/schemas/StationId'
              - name: X-Trace-Id
                in: header
                required: true
                schema:
                    type: string
                    x-usrv-cpp-type: boost::uuids::uuid
            responses:
                '200':
                    description: OK
                    headers:
                        X-Request-Id:
                            required: true
                            schema:
                                type: string
                                format: uuid

    /test1/shared/{spot}:
        parameters:
          - name: spot
            in: path
            required: true
            schema:
                type: string
                format: uuid
          - name: unit
            in: query
            required: false
            schema:
                type: string
                enum:
                  - metric
                  - imperial
        get:
            responses:
                '200':
                    description: OK
        put:
            parameters:
              - name: extra
                in: query
                required: false
                schema:
                    type: integer
            responses:
                '200':
                    description: OK

    /test1/strong/{account}:
        get:
            parameters:
              - name: account
                in: path
                required: true
                schema:
                    $ref: '#/components/schemas/AccountId'
              - name: station
                in: query
                required: true
                schema:
                    type: string
                    format: uuid
                    x-usrv-cpp-type: test::StationId
              - name: accounts
                in: query
                required: true
                schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountId'
              - name: count
                in: query
                required: true
                schema:
                    type: integer
                    format: int64
                    x-usrv-cpp-type: test::Count
              - name: label
                in: query
                required: true
                schema:
                    type: string
                    x-usrv-cpp-type: test::Label
              - name: timeout
                in: query
                required: true
                schema:
                    type: integer
                    x-usrv-cpp-type: std::chrono::milliseconds
              - name: X-Account-Id
                in: header
                required: true
                schema:
                    $ref: '#/components/schemas/AccountId'
            responses:
                '200':
                    description: OK
                    headers:
                        X-Account-Id:
                            required: true
                            schema:
                                $ref: '#/components/schemas/AccountId'
                        X-Retry-After:
                            required: true
                            schema:
                                type: integer
                                x-usrv-cpp-type: std::chrono::seconds

components:
    schemas:
        AccountId:
            type: string
            format: uuid
            x-usrv-cpp-type: test::AccountId
        StationId:
            type: string
            x-usrv-cpp-type: boost::uuids::uuid
