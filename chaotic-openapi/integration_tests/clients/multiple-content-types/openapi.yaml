openapi: 3.0.0
info:
    title: test-object client
    version: '1.0'

paths:
    /test1:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/single-json'
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/single-form-data'
                    application/x-www-form-urlencoded:
                        schema:
                            $ref: '#/components/schemas/single-form-urlen'
                    application/octet-stream:
                        schema:
                            $ref: '#/components/schemas/single-octet'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common-response'
                        application/octet-stream:
                            schema:
                                type: string
    /test-single-json:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/single-json'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common-response'

    /test-single-form-data:
        post:
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/single-form-data'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common-response'

    /test-single-form-urlen:
        post:
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            $ref: '#/components/schemas/single-form-urlen'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common-response'

    /test-single-octet:
        post:
            requestBody:
                content:
                    application/octet-stream:
                        schema:
                            $ref: '#/components/schemas/single-octet'
            responses:
                '200':
                    description: OK
                    content:
                        application/octet-stream:
                            schema:
                                type: string                                
components:
    schemas:
        single-json:
            type: object
            properties:
                foo:
                    type: string
            additionalProperties: false
        single-form-data:
            type: object
            required:
                - filename
            properties:
                filename:
                    type: string
                content:
                    type: string
            additionalProperties: false
        single-form-urlen:
            type: object
            required:
                - name
                - age
            properties:
                name:
                    type: string
                password:
                    type: string
                age:
                    type: integer
                salary:
                    type: number
                is_smoking:
                    type: boolean
            additionalProperties: false
        single-octet:
            type: string
        common-response:
            type: object
            properties:
                bar:
                    type: string
            additionalProperties: false
