definitions:
    Number:
        type: number
        minimum: 1
        maximum: 100

    OneOf:
        oneOf:
          - type: boolean
          - $ref: '#/definitions/Number'
          - type: object
            additionalProperties: false
            properties: {}

    ObjectOneOfNoDiscriminator:
        type: object
        additionalProperties: false
        properties:
            oneof:
                $ref: '#/definitions/OneOf'

    ObjectOneOfWithDiscriminator:
        type: object
        additionalProperties: false
        properties:
            oneof:
                oneOf:
                  - $ref: '#/definitions/ObjectFoo'
                  - $ref: '#/definitions/ObjectBar'
                discriminator:
                    propertyName: type

    ObjectFoo:
        type: object
        additionalProperties: false
        properties:
            type:
                type: string
            foo:
                type: integer
                minimum: 1

    ObjectBar:
        type: object
        additionalProperties: false
        properties:
            type:
                type: string
            bar:
                type: string
                minLength: 3

    ObjectRequired:
        type: object
        additionalProperties: false
        required:
          - id
        properties:
            id:
                type: integer
            name:
                type: string

    StringKind:
        type: string
        enum:
          - first
          - second

    IntKind:
        type: integer
        enum:
          - 1
          - 2

    ObjectWithKind:
        type: object
        additionalProperties: false
        required:
          - kind
        properties:
            kind:
                $ref: '#/definitions/StringKind'
            optional_kind:
                $ref: '#/definitions/IntKind'

    OneOfPrechecked:
        oneOf:
          - $ref: '#/definitions/ObjectRequired'
          - $ref: '#/definitions/ObjectFoo'
          - $ref: '#/definitions/StringKind'
          - $ref: '#/definitions/IntKind'

    ObjectOneOfPrechecked:
        type: object
        additionalProperties: false
        properties:
            oneof:
                $ref: '#/definitions/OneOfPrechecked'

