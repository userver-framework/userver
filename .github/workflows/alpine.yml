name: Alpine

'on':
    pull_request:
    push:
        branches:
          - master
          - develop
          - feature/**

env:
    UBSAN_OPTIONS: print_stacktrace=1
    ASAN_OPTIONS: detect_odr_violation=2
    CXX: clang++-22
    CC: clang-22
    CCACHE_DIR: /home/runner/.cache/ccache
    CCACHE_NOHASHDIR: true
    # Keep CPM cache on the same filesystem as the build tree. gRPC's
    # download_archive uses file(RENAME) from build_debug/ into the CPM cache;
    # a separate bind-mount for CPM_SOURCE_CACHE causes "Cross-device link".
    CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm
    APK_TOOLS_URL: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static
    APK_TOOLS_SHA256: 34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c

jobs:
    posix:
        strategy:
            fail-fast: false

        name: alpine (build-only)
        runs-on: ubuntu-24.04

        env:
            CMAKE_PROGRAM_PATH: /usr/lib/llvm22/bin
            CMAKE_FLAGS: >-
                -DCMAKE_BUILD_TYPE=Debug
                -DCMAKE_CXX_STANDARD=20
                -DUSERVER_USE_LD=lld
                -DUSERVER_NO_WERROR=OFF
                -DUSERVER_BUILD_ALL_COMPONENTS=1
                -DUSERVER_BUILD_SAMPLES=1
                -DUSERVER_BUILD_TESTS=1
                -DUSERVER_FEATURE_JEMALLOC=OFF
                -DUSERVER_FEATURE_KAFKA=OFF
                -DUSERVER_FEATURE_CLICKHOUSE=OFF
                -DUSERVER_FEATURE_STACKTRACE=OFF
                -DUSERVER_FEATURE_PATCH_LIBPQ=OFF
                -DUSERVER_FEATURE_YDB=OFF
                -DUSERVER_DISABLE_RSEQ_ACCELERATION=YES
                -DUSERVER_FORCE_DOWNLOAD_ABSEIL=1
                -DUSERVER_FORCE_DOWNLOAD_PROTOBUF=1
                -DUSERVER_FORCE_DOWNLOAD_GRPC=1

        steps:
          - uses: actions/checkout@v7
            with:
                fetch-depth: 0

          - name: Restore cached directories
            id: restore-cache
            uses: actions/cache/restore@v6
            with:
                path: |
                    ${{env.CCACHE_DIR}}
                    ${{env.CPM_SOURCE_CACHE}}
                key: 'alpine-cache-dir ${{github.ref}} run-${{github.run_number}}'
                restore-keys: |
                    alpine-cache-dir ${{github.ref}}
                    alpine-cache-dir

          - name: Setup host cache dirs
            run: |
                mkdir -p ${{env.CCACHE_DIR}}
                mkdir -p ${{env.CPM_SOURCE_CACHE}}

          # gitlab.alpinelinux.org is often unreachable from GitHub runners, and
          # setup-alpine skips the download if $RUNNER_TEMP/apk has the expected hash.
          - name: Cache apk-tools
            id: apk-cache
            uses: actions/cache@v6
            with:
                path: ${{runner.temp}}/apk
                key: 'apk-static ${{env.APK_TOOLS_SHA256}}'

          - name: Download apk-tools
            if: steps.apk-cache.outputs.cache-hit != 'true'
            run: |
                curl --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 \
                    -fsSL -o "$RUNNER_TEMP/apk" "$APK_TOOLS_URL"
                echo "$APK_TOOLS_SHA256  $RUNNER_TEMP/apk" | sha256sum -c

          - name: Setup latest Alpine Linux
            # Pinned: the cache above relies on the action's apk download path.
            uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050  # v1.4.1
            with:
                apk-tools-url: '${{env.APK_TOOLS_URL}}#!sha256!${{env.APK_TOOLS_SHA256}}'
                volumes: |
                    ${{env.CCACHE_DIR}}:${{env.CCACHE_DIR}}

          - name: Install dependencies
            shell: alpine.sh --root {0}
            run: |
                pwd
                cat /etc/alpine-release
                apk add gcc lld22 compiler-rt ccache git gdb
                apk add $(cat scripts/docs/en/deps/alpine.md)
                # Tell clang22 to use lld for linking
                echo '-fuse-ld=lld' >> /etc/clang22/$(clang++-22 -dumpmachine).cfg

          - name: Install test dependencies
            shell: alpine.sh --root {0}
            run: |
                apk add postgresql16 \
                        redis \
                        rabbitmq-server \

          - name: Setup caches
            shell: alpine.sh --root {0}
            run: |
                echo "Cached CPM packages:"
                du -h -d 1 ${{env.CPM_SOURCE_CACHE}}
                for f in $(find ${{env.CPM_SOURCE_CACHE}} -name "cmake.lock");
                do
                  repo=$(ls -d $(dirname $f)/*/);
                  echo "Repository: $repo";
                  git config --global --add safe.directory $repo;
                done

                ccache -M 2.0GB
                ccache -s -v

          - name: Run cmake
            shell: alpine.sh --root {0}
            run: |
                pwd
                cmake -S . -B build_debug $CMAKE_FLAGS

          - name: Reconfigure cmake
            shell: alpine.sh --root {0}
            run: |
                pwd
                cmake -S . -B build_debug $CMAKE_FLAGS

          - name: Compile
            shell: alpine.sh --root {0}
            run: |
                cmake --build build_debug -j$(nproc)

          - name: Save cached directories
            uses: actions/cache/save@v6
            with:
                path: |
                    ${{env.CCACHE_DIR}}
                    ${{env.CPM_SOURCE_CACHE}}
                key: ${{ steps.restore-cache.outputs.cache-primary-key }}

          - name: Show cache stats
            shell: alpine.sh {0}
            run: |-
                du -h -d 1 ${{env.CCACHE_DIR}}
                du -h -d 1 ${{env.CPM_SOURCE_CACHE}}
                ccache -s -v
