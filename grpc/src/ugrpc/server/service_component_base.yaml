type: object
description: base class for all the gRPC service components
additionalProperties: false
properties:
    task-processor:
        type: string
        description: the task processor to use for responses
        default: uses grpc-server.service-defaults.task-processor
    always-log-call-spans:
        type: boolean
        description: |
            Write RPC spans regardless of log levels. Trace sampling and USERVER_NO_LOG_SPANS still apply.
            Defaults to the value from grpc-server.service-defaults.always-log-call-spans.
    use-protobuf-arena:
        type: boolean
        description: Allocate typed requests and proto-struct responses on protobuf arenas.
        defaultDescription: grpc-server.service-defaults.use-protobuf-arena (false by default)
    status-codes-log-level:
        type: object
        properties: {}
        additionalProperties:
            type: string
            description: log level
        description: |-
            gRPC status code string -> log level map.
            Allows overriding the log level for the span for individual statuses.
            See grpcpp StatusCode documentation for the list of possible values:
            https://grpc.github.io/grpc/cpp/namespacegrpc.html#aff1730578c90160528f6a8d67ef5c43b

            Example:
              -  FAILED_PRECONDITION: info
