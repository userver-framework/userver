type: object
description: Component that configures and manages the gRPC server.
additionalProperties: false
properties:
    port:
        type: integer
        description: the port to use for all gRPC services, or 0 to pick any available
    unix-socket-path:
        type: string
        description: unix socket absolute path
    use-callback-api:
        type: boolean
        description: Use the gRPC callback/reactor API for server RPCs instead of completion queues.
        default: false
    event-engine:
        type: object
        description: settings of the userver EventEngine of this server
        additionalProperties: false
        properties:
            enabled:
                type: boolean
                description: |
                    Run the socket I/O and timers of this server on a userver task processor
                    (userver EventEngine) instead of gRPC's own threads. Enabling it changes
                    gRPC settings for the whole process, including other gRPC servers and
                    clients. Requires use-callback-api. Not available in CMake builds yet.
                default: false
            task-processor:
                type: string
                description: |
                    Task processor for the userver EventEngine. Has no effect unless
                    the engine is enabled.
                defaultDescription: components_manager.default_task_processor
    completion-queue-count:
        type: integer
        description: |
            Number of server completion queues. With use-callback-api enabled,
            these queues are created only when no services are registered;
            client queues are configured through grpc-client-common.completion-queue-count.
        default: 2
        minimum: 1
    channel-args:
        type: object
        description: a map of channel arguments, see gRPC Core docs
        default: {}
        additionalProperties:
            type: string
            description: value of channel argument, must be string or integer
        properties: {}
    native-log-level:
        type: string
        description: min log level for the native gRPC library
        default: 'error'
        enum:
          - trace
          - debug
          - info
          - warning
          - error
          - critical
          - none
    enable-channelz:
        type: boolean
        description: enable channelz
        default: false
    tls:
        type: object
        additionalProperties: false
        description: TLS settings
        properties:
            ca:
                type: string
                description: path to TLS client CA certificate
            key:
                type: string
                description: path to TLS certificate key
            cert:
                type: string
                description: path to TLS certificate
    service-defaults:
        type: object
        description: omitted options for service components will default to the corresponding option from here
        additionalProperties: false
        properties:
            task-processor:
                type: string
                description: the task processor to use for responses
            always-log-call-spans:
                type: boolean
                description: default value of always-log-call-spans for gRPC service components
                default: false
