type: object
description: MySQL client component
additionalProperties: false
properties:
    initial_pool_size:
        type: integer
        description: number of connections created initially
        default: 5
    max_pool_size:
        type: integer
        description: maximum number of created connections
        default: 10
    use_secure_connection:
        type: boolean
        description: |
            whether to require TLS for connections; connections to servers
            without TLS support fail. Server certificate verification follows
            libmariadb defaults. Set to false to allow unencrypted connections.
            Ignored in testsuite runs, where TLS is disabled via
            testsuite-support's testsuite-mysql-is-tls-enabled option
        defaultDescription: true
