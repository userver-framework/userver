components_manager:
    components:
        handler-chaos:
            path: /chaos
            task_processor: main-task-processor
            method: GET,POST,DELETE

        handler-chaos-trx:
            path: /chaos/trx
            task_processor: main-task-processor
            method: GET,POST,DELETE

        # [ODBC component config]
        key-value-db:
            secdist_alias: key-value-db
            min_pool_size: 1
            max_pool_size: 1
        # [ODBC component config]

        secdist: {}
        default-secdist-provider:
            config: /etc/odbc_service/secure_data.json
            missing-ok: true
            environment-secrets-key: SECDIST_CONFIG

        server:
            listener:
                port: 8097
                task_processor: main-task-processor
            listener-monitor:
                port: $monitor-server-port
                port#fallback: 8098
                task_processor: main-task-processor

        handler-server-monitor:
            path: /service/monitor
            method: GET
            task_processor: main-task-processor

        testsuite-support:

        http-client: {}
        http-client-core:
            fs-task-processor: fs-task-processor

        tests-control:
            method: POST
            path: /tests/{action}
            task_processor: main-task-processor
            testpoint-url: $mockserver/testpoint
            testpoint-timeout: 10s
            skip-unregistered-testpoints: true
            throttling_enabled: false
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: debug
                    overflow_behavior: discard

        dns-client:
            fs-task-processor: fs-task-processor

    task_processors:
        main-task-processor:
            worker_threads: 4
        fs-task-processor:
            worker_threads: 4

    default_task_processor: main-task-processor
