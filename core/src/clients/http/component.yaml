type: object
description: Component that manages clients::http::ClientWithMiddlewares.
additionalProperties: false
properties:
    allow-url-userinfo:
        type: boolean
        description: Allow embedded username/password in request and redirect URLs. Set to false to reject URL userinfo; explicit
            HTTP authentication and proxy URL credentials remain supported.
        default: false
    wait-for-dynamic-configs:
        type: boolean
        description: |
            Whether to wait for dynamic configs to be loaded.
            Defaults to true for all clients except for dynamic-config-http-client.
    core-component:
        type: string
        description: name of components::HttpClientCore component to use
        default: http-client-core
    middlewares:
        type: object
        description: map of middlewares to apply. Middleware settings from components::HttpClient override settings from @ref
            clients::http::MiddlewarePipelineComponent
        properties: {}
        additionalProperties:
            type: object
            description: middleware config
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
                    description: enable middleware
