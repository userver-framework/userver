type: object
description: Base class for LRU-cache components
additionalProperties: false
properties:
    size:
        type: integer
        description: max amount of items to store in cache
    ways:
        type: integer
        description: number of ways for associative cache
    lifetime:
        type: string
        description: TTL for cache entries (0 is unlimited)
        default: 0
    background-update:
        type: boolean
        description: enables asynchronous updates for expiring values
        default: false
    config-settings:
        type: boolean
        description: enables dynamic reconfiguration with CacheConfigSet
        default: true
    wait-for-dynamic-configs:
        type: boolean
        description: >-
            wait for the first dynamic config before constructing the cache.
            If false, use static settings until dynamic config arrives, then apply
            dynamic updates normally. Has no effect when config-settings is false.
        default: true
