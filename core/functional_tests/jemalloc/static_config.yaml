components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 2
        fs-task-processor:
            worker_threads: 2
        monitor-task-processor:
            thread_name: mon-worker
            worker_threads: 1

    default_task_processor: main-task-processor

    components:
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
                    overflow_behavior: discard

        server:
            listener:
                port: 8080
                task_processor: main-task-processor
            listener-monitor:
                port: 8081
                task_processor: monitor-task-processor

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false

        handler-jemalloc:
            path: /service/jemalloc/pprof/{command}
            method: GET,POST
            task_processor: monitor-task-processor
