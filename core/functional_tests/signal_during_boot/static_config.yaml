components_manager:
    components:
        slow-component:
        testsuite-support:
        tests-control:
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
            testpoint-url: $mockserver/testpoint
            testpoint-timeout: 10s
        http-client:
        http-client-core:
            fs-task-processor: main-task-processor
        dns-client:
            fs-task-processor: main-task-processor
        server:
            listener:
                port: 8089
                task_processor: main-task-processor
        logging:
            fs-task-processor: main-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: debug
                    overflow_behavior: discard

    task_processors:
        main-task-processor:
            worker_threads: 4

    default_task_processor: main-task-processor
    fs_task_processor: main-task-processor
